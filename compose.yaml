services:
  web:
    build:
      context: .
      dockerfile: Containerfile
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    restart: on-failure
    ports:
      - "127.0.0.1:${SHIBUMI_PORT:-9100}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 3s
      retries: 3
